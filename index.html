<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Garage Vault 2000</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.1);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #d71920;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #d71920;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #b9141a;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
        }

        .switch button {
            border: none;
            background: none;
            color: #d71920;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <div class="logo">
                GV
            </div>

            <h1>Garage Vault 2000</h1>

            <p class="subtitle">
                Garage management system
            </p>

            <div id="loginSection">

                <h2>Login</h2>

                <form>
                    <label>Email</label>
                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label>Password</label>
                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button class="btn" type="submit">
                        Login
                    </button>
                </form>

                <div class="switch">
                    Don't have an account?
                    <button type="button" onclick="showSignup()">
                        Sign up
                    </button>
                </div>

            </div>


            <div id="signupSection" style="display:none;">

                <h2>Create Account</h2>

                <form>

                    <label>Full Name</label>
                    <input
                        type="text"
                        placeholder="Your full name"
                        required
                    >

                    <label>Garage / Business Name</label>
                    <input
                        type="text"
                        placeholder="Your garage name"
                        required
                    >

                    <label>Phone</label>
                    <input
                        type="tel"
                        placeholder="Phone number"
                    >

                    <label>Email</label>
                    <input
                        type="email"
                        placeholder="Email address"
                        required
                    >

                    <label>Password</label>
                    <input
                        type="password"
                        placeholder="Create a password"
                        required
                    >

                    <label>Confirm Password</label>
                    <input
                        type="password"
                        placeholder="Confirm password"
                        required
                    >

                    <button class="btn" type="submit">
                        Create Garage Account
                    </button>

                </form>

                <div class="switch">
                    Already have an account?
                    <button type="button" onclick="showLogin()">
                        Login
                    </button>
                </div>

            </div>


            <footer>
                Made by Keith Makirimira
            </footer>

        </div>

    </div>


    <script>

        function showSignup() {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("signupSection").style.display = "block";
        }

        function showLogin() {
            document.getElementById("signupSection").style.display = "none";
            document.getElementById("loginSection").style.display = "block";
        }

    </script>

</body>
</html>
